name: Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get install -y libblas-dev liblapack-dev

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Runners have no GPU, and the default torch wheel preloads CUDA
      # libraries that crash with "Illegal instruction". Resolve torch from
      # the CPU-only index instead (only in this CI checkout; nothing is committed).
      - name: Use CPU-only torch
        run: |
          poetry source add --priority=explicit pytorch-cpu https://download.pytorch.org/whl/cpu
          poetry add --lock torch --source pytorch-cpu

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-cpu-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-py3.11-cpu-

      - name: Install dependencies
        run: poetry sync --no-interaction

      - name: Run tests
        run: poetry run pytest tests/ -m "not expensive"
